name: release

# Пуш в ветку release собирает установщики для Windows, macOS и Linux
# и выкладывает их в GitHub Releases как пре-релиз vВЕРСИЯ (версия из tauri.conf.json).
on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  # Релиз создаётся один раз заранее — иначе параллельные сборки плодят дубли.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.rel.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./src-tauri/tauri.conf.json').version;
            const tag = `v${version}`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              return data.id;
            } catch {
              const { data } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `YM Vinil ${tag}`,
                body: 'Windows: скачайте файл -setup.exe ниже. Уже установленное приложение обновится само.',
                prerelease: false,
              });
              return data.id;
            }

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-зависимости
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись обновлений: приватный ключ — секрет репозитория (без пароля).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

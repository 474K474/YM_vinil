name: Баг
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали и что получилось. Скриншот очень помогает.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия YM Vinil
      placeholder: "1.0.0 — видно в установщике или в Releases"
  - type: dropdown
    id: os
    attributes:
      label: Система
      options: [Windows, macOS, Linux]
  - type: textarea
    id: error
    attributes:
      label: Текст ошибки
      description: Если под проигрывателем появилась красная строка — скопируйте её сюда.
